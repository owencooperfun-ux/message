
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;

            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            background: #f2f2f7;
            color: #1c1c1e;
        }

        .card {
            width: 100%;
            max-width: 360px;
            padding: 28px 24px;
            box-sizing: border-box;

            background: white;
            border-radius: 20px;

            text-align: center;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin: 0 0 10px;
            font-size: 22px;
            font-weight: 600;
        }

        .message {
            margin: 0 0 22px;
            font-size: 17px;
            line-height: 1.5;
            font-weight: 400;
        }

        .close-button {
            display: inline-block;
            padding: 10px 24px;

            border: none;
            border-radius: 12px;

            background: #07075a;
            color: white;

            font-family: inherit;
            font-size: 17px;
            font-weight: 500;

            cursor: pointer;
        }

        .close-button:active {
            display: inline-block;
            margin-top: 4px;
            opacity :0.7;
        }
        .bottom-text {
            margin: 24px 0 0;
            font-size: 14px;
            line-height: 1.5;
            color: #8e8e93;
        }
    </style>
</head>

<body>

    <div class="card">
        
        <p class="title">This device is currently being managed by Jamf. </p>

        <p class="message">
            Administrator: Owen Cooper <br>Please contact your administrator for more information.
        </p>
        <button class="close-button" onclick="window.location.href='about:blank'">
            Close
        </button>
        <p class="bottom-text">
            Powered by Jamf Now <br> Last Updated:
        </p>
    </div>
    

</body>

</html>
